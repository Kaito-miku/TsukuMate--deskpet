<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="quick-launcher.css">
  <title>Quick actions</title>
</head>
<body>
  <main class="launcher" aria-label="Quick actions">
    <button type="button" data-action="chat"><span class="icon">◇</span><span class="label" data-label="chat">问答</span><span class="hint" data-hint="chat">开始对话</span></button>
    <button type="button" data-action="dnd"><span class="icon">☾</span><span class="label" data-label="dnd">休眠</span><span class="hint" data-hint="dnd">免打扰</span></button>
    <button type="button" data-action="settings"><span class="icon">⚙</span><span class="label" data-label="settings">设置</span><span class="hint" data-hint="settings">个性化</span></button>
    <button type="button" data-action="close"><span class="icon">×</span><span class="label" data-label="close">关闭</span><span class="hint" data-hint="close">收起菜单</span></button>
  </main>
  <script src="quick-launcher-renderer.js"></script>
</body>
</html>
