<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' http://127.0.0.1:*; style-src 'self'; img-src 'self' data: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:*;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TsukuMate 对话</title>
  <link rel="stylesheet" href="chat-workspace.css">
  <link rel="stylesheet" href="chat-workspace-screen.css">
</head>
<body>
  <main class="workspace">
    <nav class="tool-rail" aria-label="工具栏">
      <button class="tool avatar" disabled title="头像功能将在后续加入"><span>月</span></button>
      <button class="tool chat-tool" id="chat-tool" title="问答" aria-label="返回问答">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5.5h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-6l-4.8 3v-3h-.2a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/></svg>
      </button>
      <button class="tool" id="history-tool" title="聊天历史">⌁</button>
      <button class="tool" id="diary-tool" title="日记">▤</button>
    </nav>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <header><strong id="drawer-title">聊天历史</strong><button id="drawer-close">×</button></header>
      <div class="date-list" id="date-list"></div>
    </aside>
    <section class="content-pane">
      <header class="content-header">
        <button class="back-button" id="back-button" hidden>‹ 返回</button>
        <div><h1 id="page-title">与 TsukuMate 对话</h1><p id="page-subtitle">今天的对话会自动保存在本地</p></div>
        <span class="connection-dot" title="OpenAI 兼容服务"></span>
      </header>
      <div class="chat-view" id="chat-view"><div class="messages" id="messages"></div></div>
      <button class="jump-bottom" id="jump-bottom" type="button" hidden>回到最新 ↓</button>
      <div class="diary-view" id="diary-view" hidden>
        <textarea id="diary-editor" spellcheck="false" placeholder="选择左侧的一篇日记"></textarea>
        <footer><span id="diary-status"></span><button id="diary-generate">重新生成</button><button id="diary-folder">打开文件夹</button><button class="primary" id="diary-save">保存</button></footer>
      </div>
      <footer class="composer" id="composer">
        <div class="screen-attachment" id="screen-attachment" hidden>
          <img id="screen-preview" alt="待发送的屏幕截图">
          <span>仅附加到下一条消息</span>
          <button id="screen-remove" type="button" aria-label="移除截图">×</button>
        </div>
        <div class="screen-picker" id="screen-picker" hidden>
          <div class="screen-picker-head"><strong>选择要读取的显示器</strong><button id="screen-picker-close" type="button">×</button></div>
          <p id="screen-picker-status">截图只会用于下一条消息，不会保存到本地。</p>
          <div class="screen-source-list" id="screen-source-list"></div>
        </div>
        <textarea id="prompt" rows="2" placeholder="输入消息，Cmd/Ctrl + Enter 发送"></textarea>
        <div class="composer-actions"><button class="screen-button" id="screen-button" type="button" title="读取屏幕">⌗ 读取屏幕</button><span id="send-status">准备就绪</span><button id="cancel" hidden>停止</button><button class="primary" id="send">发送</button></div>
      </footer>
    </section>
    <aside class="live2d-pane">
      <div id="pet-container"><div id="live2d-stage"></div></div>
      <div class="live2d-feedback" id="live2d-feedback"><span id="live2d-feedback-text">正在加载 Live2D…</span><button id="live2d-retry" type="button" hidden>重新加载</button></div>
      <div class="emotion-pill" id="emotion-pill">平静</div>
    </aside>
  </main>
  <script src="chat-workspace-renderer.js"></script>
  <script src="live2d-bootstrap.js"></script>
</body>
</html>
