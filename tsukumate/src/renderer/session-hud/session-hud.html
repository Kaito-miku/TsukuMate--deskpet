<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;">
<title>Session HUD</title>
<style>
* { box-sizing: border-box; }

:root {
  --hud-bg: rgba(255, 255, 255, 0.88);
  --hud-border: rgba(0, 0, 0, 0.12);
  --text: #242427;
  --text-muted: #6b6b70;
  --shadow: rgba(0, 0, 0, 0.16);
  --running: #16a34a;
  --done: #2563eb;
  --attention: #373ED8;
  --attention-rgb: 55, 62, 216;
  --interrupted: #dc2626;
  --idle: #9ca3af;
}

@media (prefers-color-scheme: dark) {
  :root {
    --hud-bg: rgba(32, 32, 36, 0.88);
    --hud-border: rgba(255, 255, 255, 0.12);
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --shadow: rgba(0, 0, 0, 0.34);
    --done: #60a5fa;
    --attention: #818cf8;
    --attention-rgb: 129, 140, 248;
    --interrupted: #f87171;
    --idle: #71717a;
  }
}

html, body {
  width: 100%;
  margin: 0;
  background: transparent;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  font-size: 12px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

html, body { height: 100%; overflow: hidden; }
body { padding: 2px 3px 8px; }

.hud {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--hud-border);
  border-radius: 8px;
  background: var(--hud-bg);
  box-shadow: 0 8px 18px -12px var(--shadow), 0 2px 4px rgba(0, 0, 0, 0.10);
  overflow: hidden;
  position: relative;
}

.hud.has-pin .row {
  padding-right: 48px;
}

.pin-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 16px;
  height: 16px;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  z-index: 2;
  opacity: 0.55;
  transition: opacity 100ms cubic-bezier(.25,1,.5,1), background 100ms cubic-bezier(.25,1,.5,1), color 100ms cubic-bezier(.25,1,.5,1);
}

.pin-btn:hover {
  opacity: 1;
  background: rgba(0, 0, 0, 0.06);
}

.pin-btn.pinned {
  opacity: 1;
  color: var(--attention);
}

.collapse-btn {
  position: absolute;
  top: 4px;
  right: 23px;
  width: 16px;
  height: 16px;
  padding: 0;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  opacity: 0.65;
}

.collapse-btn:hover { opacity: 1; background: rgba(0, 0, 0, 0.06); }
@media (prefers-color-scheme: dark) { .collapse-btn:hover { background: rgba(255, 255, 255, 0.10); } }

@media (prefers-color-scheme: dark) {
  .pin-btn:hover {
    background: rgba(255, 255, 255, 0.10);
  }
}

.row {
  height: 48px;
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  cursor: pointer;
  transition: background 80ms cubic-bezier(.25,1,.5,1);
}

.row-unfocusable {
  cursor: default;
}

.row:hover {
  background: rgba(0, 0, 0, 0.06);
}

@media (prefers-color-scheme: dark) {
  .row:hover {
    background: rgba(255, 255, 255, 0.08);
  }
}

.row:active {
  background: rgba(0, 0, 0, 0.10);
}

@media (prefers-color-scheme: dark) {
  .row:active {
    background: rgba(255, 255, 255, 0.12);
  }
}

.row .left {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  flex: 1 1 auto;
  min-width: 0;
}

.task-card-row { gap: 8px; }
.task-card-text { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; }
.task-card-text .title { width: 100%; line-height: 1.1; }
.progress { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; line-height: 1; color: var(--text-muted); }
.hud.compact .task-card-text { justify-content: center; }
.hud.compact .progress { display: none; }

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
  background: var(--idle);
}

.dot-running { background: var(--running); animation: dot-pulse 1.6s ease-in-out infinite; }
.dot-done { background: var(--done); }
.dot-interrupted { background: var(--interrupted); }
.dot-idle { background: var(--idle); }

@keyframes dot-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.8); }
}

.agent-icon {
  width: 16px;
  height: 16px;
  flex: 0 0 auto;
  object-fit: contain;
}

.title {
  min-width: 0;
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
  line-height: 1;
  color: var(--text);
}

.row-folded .title {
  font-weight: 500;
  color: var(--text-muted);
}

.right {
  flex: 0 1 auto;
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 400;
  line-height: 1;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  max-width: 58%;
  /* Flexbox quirk: overflow:hidden makes a flex item's AUTOMATIC minimum
     size 0, so under squeeze .right shrinks below its chips and its own
     overflow clipping cuts them mid-glyph. min-content restores a real
     floor: it equals bell+chips+gaps exactly, because the elapsed span
     carries its own zero floor and contributes nothing. Squeeze order:
     title first, then elapsed, chips never clip. */
  min-width: min-content;
  overflow: hidden;
  white-space: nowrap;
}

.elapsed {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.state-chip {
  flex: 0 0 auto;
  font-size: 10px;
  font-weight: 500;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 3px;
  white-space: nowrap;
}
.chip-thinking { background: rgba(99, 102, 241, 0.13); color: #6366f1; }
.chip-working { background: rgba(22, 163, 74, 0.13); color: #16a34a; }
.chip-juggling { background: rgba(22, 163, 74, 0.13); color: #16a34a; }
.chip-sweeping { background: rgba(107, 114, 128, 0.13); color: #52525b; }
.chip-notification { background: rgba(var(--attention-rgb), 0.13); color: var(--attention); }
.chip-worktree { background: rgba(59, 130, 246, 0.13); color: #2563eb; }
.chip-interrupted { background: rgba(239, 68, 68, 0.10); color: #dc2626; }

.usage-chip {
  flex: 0 0 auto;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 3px;
  white-space: nowrap;
}
.usage-neutral { background: rgba(107, 114, 128, 0.13); color: #52525b; }
.usage-warm { background: rgba(var(--attention-rgb), 0.13); color: var(--attention); }
.usage-hot { background: rgba(239, 68, 68, 0.10); color: #dc2626; }

@media (prefers-color-scheme: dark) {
  .chip-thinking { background: rgba(99, 102, 241, 0.20); color: #818cf8; }
  .chip-working { background: rgba(22, 163, 74, 0.20); color: #4ade80; }
  .chip-juggling { background: rgba(22, 163, 74, 0.20); color: #4ade80; }
  .chip-sweeping { background: rgba(107, 114, 128, 0.20); color: #a1a1aa; }
  .chip-notification { background: rgba(var(--attention-rgb), 0.20); color: var(--attention); }
  .chip-worktree { background: rgba(59, 130, 246, 0.20); color: #60a5fa; }
  .chip-interrupted { background: rgba(239, 68, 68, 0.15); color: #f87171; }
  .usage-neutral { background: rgba(107, 114, 128, 0.20); color: #a1a1aa; }
  .usage-warm { background: rgba(var(--attention-rgb), 0.20); color: var(--attention); }
  .usage-hot { background: rgba(239, 68, 68, 0.15); color: #f87171; }
}

.completion-bell {
  flex: 0 0 auto;
  color: var(--attention);
  display: flex;
  align-items: center;
}

.focus-unavailable {
  width: 13px;
  height: 13px;
  flex: 0 0 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  opacity: 0.72;
}

.focus-unavailable svg {
  width: 11px;
  height: 11px;
}

@keyframes bell-ring {
  0%   { transform: rotate(0deg); }
  10%  { transform: rotate(12deg); }
  20%  { transform: rotate(-10deg); }
  30%  { transform: rotate(8deg); }
  40%  { transform: rotate(-6deg); }
  50%  { transform: rotate(0deg); }
  100% { transform: rotate(0deg); }
}

.unread-bell svg {
  animation: bell-ring 1.8s ease-in-out infinite;
  transform-origin: 50% 2px;
}

@media (prefers-reduced-motion: reduce) {
  .dot-running {
    animation: none;
  }

  .unread-bell svg {
    animation: none;
  }
}
/* HIG material and spacing pass for the desktop task card. */
:root{--hud-bg:rgba(255,255,255,.7);--hud-border:rgba(60,60,67,.12);--text:#1d1d1f;--text-muted:rgba(60,60,67,.76);--shadow:rgba(0,0,0,.1);--attention:#0071e3;--attention-rgb:0,113,227}@media(prefers-color-scheme:dark){:root{--hud-bg:rgba(30,30,30,.7);--hud-border:rgba(235,235,245,.13);--text:#f5f5f7;--text-muted:rgba(235,235,245,.76);--attention:#0a84ff;--attention-rgb:10,132,255}}.hud{border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 5px 14px rgba(0,0,0,.1),0 14px 30px rgba(0,0,0,.06);backdrop-filter:blur(20px) saturate(145%)}.pin-btn,.collapse-btn{border-radius:8px}.pin-btn:focus-visible,.collapse-btn:focus-visible{outline:2px solid var(--attention);outline-offset:1px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}}
</style>
</head>
<body>
  <div id="hud" class="hud"></div>
  <script src="./session-hud-renderer.js"></script>
</body>
</html>
